<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolarCloser AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sun:#F97316;--sun-deep:#EA580C;--sky:#0F172A;--sky-mid:#1E293B;--sky-light:#334155;--text:#F8FAFC;--muted:#94A3B8;--accent:#38BDF8;--green:#34D399}
body{font-family:'DM Sans',sans-serif;background:var(--sky);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sky-mid);border-right:1px solid rgba(249,115,22,0.15);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.logo{padding:24px 16px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:var(--sun);border-bottom:1px solid rgba(249,115,22,0.15);display:flex;align-items:center;gap:8px}
.logo-sub{font-size:0.6rem;color:var(--muted);font-weight:400;font-family:'DM Sans',sans-serif;display:block;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.nav{padding:12px;flex:1}
.nav-section{font-size:0.6rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;color:var(--muted);margin-bottom:2px;transition:all 0.2s}
.nav-item:hover{background:rgba(249,115,22,0.08);color:var(--text)}
.nav-active{background:rgba(249,115,22,0.15)!important;color:var(--sun)!important;font-weight:500}
.footer{padding:14px;border-top:1px solid rgba(249,115,22,0.15)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--sun-deep));display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:white;flex-shrink:0}
.main{margin-left:220px;flex:1;padding:28px}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem}
.accent{color:var(--sun)}
.page-sub{color:var(--muted);font-size:0.85rem;margin-top:4px}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:0.85rem;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,var(--sun),var(--sun-deep));color:white}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(249,115,22,0.4)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--sky-light)}
.btn-ghost:hover{color:var(--text);border-color:var(--sun)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--sky-mid);border:1px solid rgba(249,115,22,0.12);border-radius:12px;padding:18px;transition:border-color 0.2s}
.stat-card:hover{border-color:rgba(249,115,22,0.3)}
.stat-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-value{font-family:'Syne',sans-serif;font-weight:700;font-size:1.6rem}
.stat-icon{font-size:1.4rem;margin-bottom:6px}
.stat-change{font-size:0.7rem;margin-top:4px;color:var(--green)}
.orange{color:var(--sun)}.blue{color:var(--accent)}.green{color:var(--green)}
.card{background:var(--sky-mid);border:1px solid rgba(249,115,22,0.12);border-radius:12px;padding:22px}
.card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.table{width:100%;border-collapse:collapse}
.th{text-align:left;font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.td{padding:10px;font-size:0.85rem;border-bottom:1px solid rgba(255,255,255,0.04)}
.tr:hover .td{background:rgba(249,115,22,0.04)}
.bold{font-weight:600}.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:0.65rem;font-weight:600;text-transform:uppercase}
.badge-hot{background:rgba(249,115,22,0.2);color:var(--sun)}
.badge-warm{background:rgba(251,191,36,0.2);color:#FBBF24}
.badge-cold{background:rgba(148,163,184,0.15);color:var(--muted)}
.badge-sent{background:rgba(56,189,248,0.15);color:var(--accent)}
.badge-closed{background:rgba(52,211,153,0.15);color:var(--green)}
.progress-row{margin-bottom:12px}
.progress-header{display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:5px}
.progress-label{color:var(--muted)}.progress-pct{font-weight:600}
.progress-track{height:5px;background:rgba(255,255,255,0.07);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#FBBF24,var(--sun))}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px 0}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.bar-outer{flex:1;display:flex;align-items:flex-end;width:100%}
.bar{width:100%;background:linear-gradient(180deg,var(--sun),var(--sun-deep));border-radius:4px 4px 0 0;min-height:4px}
.bar-label{font-size:0.6rem;color:var(--muted)}
.form-group{margin-bottom:14px}
.form-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
.form-input{width:100%;padding:9px 12px;background:var(--sky);border:1px solid var(--sky-light);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.85rem;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--sun)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.proposal-result{background:linear-gradient(135deg,rgba(249,115,22,0.08),rgba(14,165,233,0.06));border:1px solid rgba(249,115,22,0.25);border-radius:12px;padding:22px;margin-top:18px}
.proposal-metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.85rem}
.proposal-metric:last-child{border-bottom:none}
.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pipeline-col{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px}
.pipeline-col-header{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.pipeline-count{background:rgba(249,115,22,0.15);color:var(--sun);border-radius:10px;padding:1px 6px;font-size:0.65rem}
.pipeline-card{background:var(--sky-mid);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;transition:border-color 0.2s}
.pipeline-card:hover{border-color:rgba(249,115,22,0.3)}
.pipeline-card-name{font-size:0.82rem;font-weight:600;margin-bottom:3px}
.pipeline-card-detail{font-size:0.72rem;color:var(--muted)}
.pipeline-card-value{font-size:0.78rem;color:var(--green);font-weight:600;margin-top:5px}
.chat-messages{height:300px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-msg{display:flex;gap:8px;align-items:flex-start}
.chat-user{flex-direction:row-reverse}
.chat-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0}
.chat-av-ai{background:linear-gradient(135deg,var(--sun),var(--sun-deep))}
.chat-av-user{background:var(--sky-light)}
.chat-bubble{max-width:75%;padding:9px 13px;border-radius:12px;font-size:0.85rem;line-height:1.5}
.chat-bubble-ai{background:#1A2942;border:1px solid rgba(249,115,22,0.15)}
.chat-bubble-user{background:linear-gradient(135deg,var(--sun),var(--sun-deep));color:white}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.06)}
.chat-input{flex:1;padding:9px 12px;background:var(--sky);border:1px solid var(--sky-light);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.85rem;outline:none}
.chat-input:focus{border-color:var(--sun)}
.btn-send{padding:9px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--sun),var(--sun-deep));color:white;cursor:pointer;font-size:0.85rem;font-weight:600}
.loading{display:inline-flex;gap:3px;align-items:center}
.loading span{width:5px;height:5px;background:var(--sun);border-radius:50%;animation:bounce 0.8s infinite;display:inline-block}
.loading span:nth-child(2){animation-delay:0.15s}
.loading span:nth-child(3){animation-delay:0.3s}
